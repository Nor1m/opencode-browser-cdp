name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - uses: browser-actions/setup-chrome@v2
        if: matrix.node == 22
        id: chrome
      - run: npm run test:browser
        if: matrix.node == 22
        env:
          CI: "true"
          OPENCODE_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: npm ci
      - run: npm run check
        env:
          CI: "true"
          OPENCODE_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
