<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDP Form Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #1c1c1c; background: #efefed; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(620px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0; }
    form { background: #fff; border: 1px solid #d9d9d5; border-radius: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.06); }
    form { padding: 22px; }
    fieldset { margin: 0 0 22px; padding: 0; border: 0; }
    legend { width: 100%; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #e7e7e3; font-weight: 650; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    label { display: grid; gap: 6px; color: #555; font-size: 12px; }
    .wide { grid-column: 1 / -1; }
    input, select, textarea, button { min-width: 0; padding: 9px 10px; color: #1e1e1e; background: #f7f7f5; border: 1px solid #d7d7d3; border-radius: 4px; outline: none; font: inherit; }
    input:focus, select:focus, textarea:focus { border-color: #111; box-shadow: 0 0 0 2px rgba(0,0,0,.07); }
    textarea { min-height: 90px; resize: vertical; }
    .checks { display: flex; flex-wrap: wrap; gap: 12px 18px; }
    .checks label { display: flex; align-items: center; gap: 7px; color: #333; }
    .checks input { width: 15px; height: 15px; padding: 0; accent-color: #111; }
    .actions { display: flex; justify-content: flex-end; }
    button { color: #fff; background: #171717; border-color: #171717; box-shadow: 0 3px 8px rgba(0,0,0,.17); cursor: pointer; font-weight: 650; }
    button:hover { background: #000; }
    #result { display: none; margin-top: 18px; padding: 16px; color: #fff; background: #171717; border-radius: 5px; }
    @media (max-width: 520px) { main { width: min(100% - 20px, 620px); padding: 10px 0; } .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } form { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <form id="demo-form">
          <fieldset>
            <legend>Contact</legend>
            <div class="grid">
              <label>Name<input id="name" name="name" autocomplete="off" placeholder="Anna"></label>
              <label>Email<input id="email" name="email" type="email" autocomplete="off" placeholder="anna@example.com"></label>
              <label>Phone<input id="phone" name="phone" type="tel" autocomplete="off" placeholder="+1 555 000 0000"></label>
              <label>Date<input id="date" name="date" type="date"></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Task</legend>
            <div class="grid">
              <label>Type<select id="type" name="type"><option value="">Choose an option</option><option value="research">Research</option><option value="purchase">Purchase</option><option value="support">Support</option></select></label>
              <label>Budget<input id="budget" name="budget" type="number" min="0" step="1000" placeholder="50000"></label>
              <label class="wide">Comment<textarea id="comment" name="comment" placeholder="Describe the task"></textarea></label>
            </div>
          </fieldset>
          <fieldset>
            <legend>Settings</legend>
            <div class="checks">
              <label><input id="urgent" name="urgent" type="checkbox"> Urgent</label>
              <label><input name="channel" type="radio" value="email"> Email</label>
              <label><input name="channel" type="radio" value="phone"> Phone</label>
              <label><input name="channel" type="radio" value="chat"> Chat</label>
            </div>
          </fieldset>
          <div class="actions"><button id="submit" type="submit">Submit</button></div>
    </form>
    <div id="result" role="status"></div>
  </main>
  <script>
    const form = document.querySelector("#demo-form")
    form.addEventListener("submit", (event) => {
      event.preventDefault()
      const data = Object.fromEntries(new FormData(form))
      const result = document.querySelector("#result")
      result.style.display = "block"
      result.textContent = `Submitted: ${data.name || "no name"}, ${data.type || "no type"}, ${data.channel || "no channel"}`
    })
  </script>
</body>
</html>
